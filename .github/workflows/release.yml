name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # Full checks gate the release: a broken tag is never shipped.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Restore only. This job compiles under -race, which keys to different
      # cache entries than the warmer produces, so the win here is the module
      # cache and, above all, no longer writing a per-tag entry that nothing can
      # ever read.
      - uses: ./.github/actions/go-build-cache

      # The checking tools at the versions mise.toml pins, the same ones the
      # git hooks run. No cache: on a tag, what gates the release is installed
      # fresh.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false

      - name: vet
        run: go vet ./...

      # No package takes longer than ~20s, so 5m is pure headroom: a wedged test
      # binary fails the job in a quarter of the time the 10m default costs.
      - name: test
        run: go test -race -timeout 5m ./...

      - name: vulnerabilities
        run: govulncheck ./...

      - name: lint
        run: golangci-lint run ./...

  # Verify the cgo-free static build and tests on the other target OSes. Audio
  # output is platform-specific (oto on macOS/Windows, PulseAudio on Linux), so
  # building on real runners catches cross-OS breakage early.
  cross-build:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      # Windows gets no goroutine dump from go test's outer kill (it cannot send
      # SIGQUIT), so the shorter timeout is also what makes the testing package's
      # own watchdog fire first and print the stacks.
      - name: test
        run: go test -timeout 5m ./...

  # BSD support is cross-compile-only: no BSD runners exist on GitHub, and the
  # regressions we guard against (#176) are compile failures from non-portable
  # deps, which a build catches without a VM.
  bsd-build:
    name: cross-build (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [freebsd, openbsd, netbsd]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/go-build-cache

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

  release:
    needs: [checks, cross-build, bsd-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # The job this whole change exists for: eleven cross-compiled targets that
      # currently start from an empty cache every single release.
      - uses: ./.github/actions/go-build-cache

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Prepare release notes
        run: bash scripts/changelog-notes.sh "${GITHUB_REF_NAME}"

      # Install the goreleaser binary only; run it in a separate step so its
      # output can be tee'd to a log the summary step parses.
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      # continue-on-error so a late publisher failure (winget/snap) does not
      # abort the job before Homebrew/Gemfury, the summary, and the gate run.
      # GitHub's bash shell runs with pipefail, so the step still reflects
      # goreleaser's exit code via steps.goreleaser.outcome.
      - name: Run goreleaser
        id: goreleaser
        continue-on-error: true
        run: goreleaser release --clean --parallelism 1 2>&1 | tee goreleaser.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          SCOOP_WINGET_TOKEN: ${{ secrets.SCOOP_WINGET_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

      # Publish the Homebrew formula to both taps from dist/checksums.txt.
      # Independent of the winget/snap pipes; continue-on-error so the gate is
      # the single red/green decision point.
      - name: Update Homebrew formula
        id: homebrew
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/update-formula.sh "${GITHUB_REF_NAME}"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Upload deb/rpm to Gemfury (stable tags only; the script self-skips betas).
      - name: Publish to Gemfury
        id: gemfury
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash scripts/update-fury.sh "${GITHUB_REF_NAME}"
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}

      # Render release notes + a per-target publish status table to the job
      # summary. Never fails the job; emits any_failed for the gate.
      - name: Release summary
        id: summary
        if: ${{ !cancelled() }}
        run: bash scripts/release-summary.sh
        env:
          LOG_FILE: goreleaser.log
          GORELEASER_OUTCOME: ${{ steps.goreleaser.outcome }}
          HOMEBREW_OUTCOME: ${{ steps.homebrew.outcome }}
          GEMFURY_OUTCOME: ${{ steps.gemfury.outcome }}

      # Single red/green gate: fail the job if any target had a problem.
      - name: Release gate
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.summary.outputs.any_failed }}" = "1" ]; then
            echo "One or more release targets failed; see the job summary." >&2
            exit 1
          fi
