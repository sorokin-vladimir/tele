[tools]
go = "1.26.11"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
golangci-lint = "2.15.0"
"aqua:koalaman/shellcheck" = "0.11.0"

[tasks.dev]
description = "Run tele (dev config: .config/tele/config.yml)"
run = "go run ./cmd/tele/ --config .config/tele/config.yml"

[tasks.dev-e]
description = "Run tele with debug logging"
run = "go run ./cmd/tele/ --config .config/tele/config.yml -e"

[tasks.build]
description = "Build binary"
run = "go build -o ./bin/tele ./cmd/tele/"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.test-v]
description = "Run all tests verbose"
run = "go test -v ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.lint-os]
description = "Run golangci-lint for every other target OS (build-tagged files)"
run = [
  "GOOS=linux golangci-lint run ./...",
  "GOOS=windows golangci-lint run ./...",
  "GOOS=freebsd golangci-lint run ./...",
]

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Full check: vet + lint (every OS) + test + vulnerabilities"
run = ["go vet ./...", "golangci-lint run ./...", { task = "lint-os" }, "go test ./...", "govulncheck ./..."]

[tasks.vuln]
description = "Report known vulnerabilities in the code the build calls"
run = "govulncheck ./..."

[tasks.shellcheck]
description = "Run ShellCheck over every tracked shell script"
run = "git ls-files -z '*.sh' | xargs -0 shellcheck"

[tasks.tidy]
description = "Tidy go modules"
run = "go mod tidy"

[tasks.vendor-hash]
description = "Print the vendorHash flake.nix needs (nix in Docker)"
run = "bash scripts/vendor-hash.sh"

[tasks.hooks]
description = "Install git hooks via lefthook"
run = "lefthook install"

[tasks.release]
description = "Cut a release: promote CHANGELOG, commit, tag (no push). Usage: mise run release <version|patch|minor|major>"
run = "bash scripts/release.sh"
