name: Nix

on:
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the older check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: flake check
        run: nix flake check --print-build-logs

      - name: build
        run: nix build .#default --print-build-logs

      - name: smoke test
        run: ./result/bin/tele --version
