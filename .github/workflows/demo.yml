name: Demo GIF

on:
  workflow_dispatch:
  # release:
  #   types: [published]

permissions: {}

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pushes the recorded GIF back to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@75064b260aea50a4b3dd1352975747d5576aaf05 # main

      - name: Install tele
        run: brew install sorokin-vladimir/tele/tele

      - name: Setup Telegram session
        run: |
          mkdir -p ~/.config/tele
          printf '%s' "${{ secrets.TG_SESSION_JSON }}" > ~/.config/tele/session.json
          cat > ~/.config/tele/config.yml <<'EOF'
          telegram:
            session_file: ~/.config/tele/session.json
          ui:
            history_limit: 50
          EOF

      - name: Install VHS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd

      - name: Install VHS
        run: brew install vhs

      - name: Record demo
        run: vhs demo.tape

      - name: Publish demo GIF
        run: |
          mkdir -p assets
          mv demo.gif assets/demo.gif
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/demo.gif
          git diff --cached --quiet || git commit -m "chore: update demo GIF"
          git push
