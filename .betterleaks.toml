# Secret scan for tele. The default rules stay on; the additions below
# cover what is specific to this repository. Not loaded on its own: pass
# `-c .betterleaks.toml` (mise run secrets does).
[extend]
useDefault = true

# The injected app key reaches the release build from CI secrets and must
# never be committed. An api_hash is 32 hex digits; the published key in
# internal/appkey is stored as base64 fragments and does not match.
[[rules]]
id = "telegram-api-hash"
description = "Telegram api_hash"
regex = '''(?i)(?:api_?hash|TG_API_HASH|buildAPIHash)\W{0,8}([0-9a-f]{32})\b'''
secretGroup = 1
keywords = ["api_hash", "apihash", "tg_api_hash", "buildapihash"]

# Placeholders used by tests and by the documented config examples. Listed by
# value rather than by path, so a real secret in the same files still fails.
[[allowlists]]
description = "known placeholders"
regexTarget = "secret"
regexes = [
  '''^hunter2$''',
  '''^secret$''',
  '''^\+1555\d{7}$''',
  '''^ee0123456789abcdef0123456789abcdef6578616d706c652e636f6d$''',
  '''^AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=$''',
]
