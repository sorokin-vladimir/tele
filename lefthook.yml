pre-push:
  parallel: true
  commands:
    vet:
      run: go vet ./...
    lint:
      run: golangci-lint run ./...
    test:
      run: go test -race ./...
    vuln:
      run: govulncheck ./...
    changelog-reminder:
      run: bash scripts/changelog-reminder.sh

pre-commit:
  commands:
    lint-fmt:
      run: golangci-lint fmt ./...
    lint-run:
      run: golangci-lint run ./...
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    actions:
      glob: ".github/**/*.{yml,yaml}"
      run: jactionlint
    renovate:
      glob: ".github/renovate.json"
      run: mise run renovate-check
    agents:
      glob: "{plugins/**,.claude-plugin/**,.agnix.toml}"
      run: mise run agents
    typos:
      run: typos --force-exclude {staged_files}
    secrets:
      run: betterleaks git --pre-commit --staged --no-banner --redact --verbose -c .betterleaks.toml .
